# Continuous integration: lint, type-check, and tests on pull requests.
#
# Deploys (push to main) are handled by deploy-site.yml, which runs the same test
# suite as its release gate - so this workflow stays PR-only to avoid running the
# suite twice for a single merge.

name: CI

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # turbo's build (and any task that depends on it) compiles webneut's
            # oscillator-rs crate, so the Rust toolchain is needed here too.
            - name: Cache Rust tools
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-wasm-pack
            - name: Prepare Rust toolchain
              run: |
                  rustup target add wasm32-unknown-unknown
                  command -v wasm-pack || cargo install wasm-pack --locked

            - name: Lint
              run: bun run lint
            - name: Type-check
              run: bun run check
            - name: Workspace tests
              run: bun run test

            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: '3.12'
            - name: Backend tests
              run: |
                  python -m pip install --quiet pytest
                  python -m pytest apps/backend/tests -q

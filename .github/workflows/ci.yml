# Continuous integration: lint, type-check, and tests on pull requests.
#
# Deploys (push to main) are handled by deploy-site.yml, which runs the same test
# suite as its release gate - so this workflow stays PR-only to avoid running the
# suite twice for a single merge.

name: CI

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # turbo's build (and any task that depends on it) compiles webneut's
            # oscillator-rs crate, so the Rust toolchain is needed here too.
            - name: Cache Rust tools
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-wasm-pack
            - name: Prepare Rust toolchain
              run: |
                  rustup target add wasm32-unknown-unknown
                  command -v wasm-pack || cargo install wasm-pack --locked

            - name: Lint
              run: bun run lint
            - name: Type-check
              run: bun run check
            - name: Workspace tests
              run: bun run test

            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'
            - name: Backend tests
              run: |
                  python -m pip install --quiet pytest
                  python -m pytest services -q

# Deploy site
#
# Builds every deployable SvelteKit app and uploads each over FTPS to
#   $FTPS_REMOTE_DIR + the app's kit.paths.base
# e.g. FTPS_REMOTE_DIR=/public_html gives /public_html/tracker, /public_html/webneut,
# and an app whose base is '' (the portfolio) lands directly in /public_html.
#
# Apps are discovered dynamically: every apps/<name>/ with a svelte.config.js is
# deployable, and its base path and Rust/WASM need are read from the repo - there is
# no hardcoded app list to maintain. On push, only apps whose files changed (or all
# apps, when shared files change) are deployed. `services/` (long-running backends) is
# excluded by construction: a service never carries a svelte.config.js. A service-only push still
# runs the test gate below, then selects no apps and skips build/deploy.
#
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   FTPS_HOST, FTPS_USER, FTPS_PASSWORD
# Required repository variable (same screen, Variables tab):
#   FTPS_REMOTE_DIR   - document root of the site on the host
# Optional repository variables:
#   FTPS_PORT         - default 21; port 990 defaults to implicit FTPS
#   FTPS_MODE         - force "explicit" (AUTH TLS on 21) or "implicit"
#   FTPS_VERIFY_CERT  - default true; set false for hosts with an incomplete chain
#   VITE_SATELLITE_API_URL - TLE API endpoint baked into the tracker bundle
#
# Uploads never delete: content-hashed assets change names, so the remote keeps
# stale files. Switch `mirror` to `mirror --delete` only on a directory that the
# app fully owns.

name: Deploy site

on:
    workflow_dispatch:
        inputs:
            apps:
                description: 'Apps to deploy, space separated (default: all)'
                type: string
                default: ''
    push:
        branches: [main]
        paths:
            - 'apps/**'
            - 'services/**'
            - 'packages/**'
            - 'package.json'
            - 'bun.lock'
            - 'turbo.json'
            - '.github/workflows/deploy-site.yml'

permissions:
    contents: read

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    test:
        name: Test
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # turbo's `test` task depends on `build`, and webneut's build compiles
            # oscillator-rs, so the Rust toolchain is needed even to run tests.
            - name: Cache Rust tools
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-wasm-pack
            - name: Prepare Rust toolchain
              run: |
                  rustup target add wasm32-unknown-unknown
                  command -v wasm-pack || cargo install wasm-pack --locked

            - name: Workspace tests
              run: bun run test

            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'
            - name: Backend tests
              run: |
                  python -m pip install --quiet pytest
                  python -m pytest services -q

    plan:
        name: Plan
        runs-on: ubuntu-26.04
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
            has_apps: ${{ steps.plan.outputs.has_apps }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - id: plan
              env:
                  EVENT: ${{ github.event_name }}
                  REQUESTED: ${{ inputs.apps }}
                  BEFORE: ${{ github.event.before }}
                  SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import json, os, pathlib, re, subprocess

                  apps = []
                  for cfg in sorted(pathlib.Path("apps").glob("*/svelte.config.js")):
                      match = re.search(r"\bbase:\s*(['\"`])(.*?)\1", cfg.read_text())
                      apps.append(
                          {
                              "app": cfg.parent.name,
                              "base": match.group(2) if match else "",
                              "wasm": "true" if (cfg.parent / "oscillator-rs").is_dir() else "false",
                          }
                      )
                  names = [a["app"] for a in apps]

                  event = os.environ.get("EVENT", "")
                  requested = os.environ.get("REQUESTED", "").split()
                  if event == "push":
                      before, sha = os.environ.get("BEFORE", ""), os.environ.get("SHA", "")
                      if before and set(before) != {"0"} and sha:
                          try:
                              changed = subprocess.run(
                                  ["git", "diff", "--name-only", before, sha],
                                  capture_output=True,
                                  text=True,
                                  check=True,
                              ).stdout.split()
                          except subprocess.CalledProcessError:
                              changed = [f"apps/{a['app']}/" for a in apps]
                      else:
                          changed = [f"apps/{a['app']}/" for a in apps]
                      shared = any(
                          p.startswith("packages/")
                          or p in ("package.json", "bun.lock", "turbo.json")
                          or p == ".github/workflows/deploy-site.yml"
                          for p in changed
                      )
                      selected = (
                          apps
                          if shared
                          else [
                              a
                              for a in apps
                              if any(p.startswith(f"apps/{a['app']}/") for p in changed)
                          ]
                      )
                  elif requested:
                      unknown = [a for a in requested if a not in names]
                      if unknown:
                          raise SystemExit(
                              "unknown app(s): " + " ".join(unknown) + " (available: " + " ".join(names) + ")"
                          )
                      selected = [a for a in apps if a["app"] in requested]
                  else:
                      selected = apps

                  # Always emit a non-empty matrix; `has_apps` gates the jobs so the
                  # empty case never relies on GitHub's empty-matrix behaviour.
                  matrix = {"include": selected or [{"app": "", "base": "", "wasm": "false"}]}
                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      out.write("matrix=" + json.dumps(matrix) + "\n")
                      out.write("has_apps=" + ("true" if selected else "false") + "\n")
                  print("Deploying:", ", ".join(a["app"] for a in selected) or "(none)")
                  PY

    build:
        name: Build ${{ matrix.app }}
        needs: [plan, test]
        if: ${{ needs.plan.outputs.has_apps == 'true' }}
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Cache Rust tools
              if: matrix.wasm == 'true'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-wasm-pack
            - name: Prepare Rust toolchain
              if: matrix.wasm == 'true'
              run: |
                  rustup target add wasm32-unknown-unknown
                  command -v wasm-pack || cargo install wasm-pack --locked

            - name: Build ${{ matrix.app }}
              env:
                  VITE_SATELLITE_API_URL:
                      ${{ vars.VITE_SATELLITE_API_URL ||
                      'https://thehuis.tail4fbfb1.ts.net/tles.json' }}
              working-directory: apps/${{ matrix.app }}
              run: bun run build

            - name: Upload build artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: build-${{ matrix.app }}
                  path: apps/${{ matrix.app }}/build
                  if-no-files-found: error

    deploy:
        name: Deploy ${{ matrix.app }}
        needs: [plan, build]
        if: ${{ needs.plan.outputs.has_apps == 'true' }}
        runs-on: ubuntu-26.04
        environment: production
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
        steps:
            - name: Check configuration
              env:
                  FTPS_HOST: ${{ secrets.FTPS_HOST }}
                  FTPS_USER: ${{ secrets.FTPS_USER }}
                  FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
                  FTPS_REMOTE_DIR: ${{ vars.FTPS_REMOTE_DIR }}
              run: |
                  missing=""
                  [ -n "$FTPS_HOST" ] || missing="$missing secret:FTPS_HOST"
                  [ -n "$FTPS_USER" ] || missing="$missing secret:FTPS_USER"
                  [ -n "$FTPS_PASSWORD" ] || missing="$missing secret:FTPS_PASSWORD"
                  [ -n "$FTPS_REMOTE_DIR" ] || missing="$missing variable:FTPS_REMOTE_DIR"
                  if [ -n "$missing" ]; then
                    echo "::error::Not configured:$missing"
                    exit 1
                  fi

            - name: Install lftp
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends lftp

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: build-${{ matrix.app }}
                  path: build

            - name: Upload over FTPS
              env:
                  FTPS_HOST: ${{ secrets.FTPS_HOST }}
                  FTPS_USER: ${{ secrets.FTPS_USER }}
                  FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
                  FTPS_PORT: ${{ vars.FTPS_PORT || '21' }}
                  FTPS_MODE: ${{ vars.FTPS_MODE }}
                  FTPS_VERIFY_CERT: ${{ vars.FTPS_VERIFY_CERT || 'true' }}
                  FTPS_REMOTE_DIR: ${{ vars.FTPS_REMOTE_DIR }}
                  BASE: ${{ matrix.base }}
              run: |
                  set -euo pipefail
                  PORT="${FTPS_PORT:-21}"
                  MODE="${FTPS_MODE:-}"
                  # Port 990 is implicit FTPS (TLS from the first byte); otherwise
                  # explicit FTPS (AUTH TLS on 21). FTPS_MODE overrides this guess.
                  if [ -z "$MODE" ]; then
                    if [ "$PORT" = "990" ]; then MODE="implicit"; else MODE="explicit"; fi
                  fi
                  if [ "$MODE" = "implicit" ]; then SCHEME="ftps"; else SCHEME="ftp"; fi
                  VERIFY_CERT="${FTPS_VERIFY_CERT:-true}"
                  REMOTE="${FTPS_REMOTE_DIR%/}${BASE}"

                  export LFTP_PASSWORD="$FTPS_PASSWORD"
                  echo "Uploading build/ to $REMOTE ($MODE on $PORT)"
                  # The password is handed to lftp through the environment (open --env-password)
                  # instead of being interpolated into the command string, so characters like
                  # " $ ` ; cannot break lftp's own command parsing.
                  set +e
                  lftp -c "
                    set ftp:ssl-force true;
                    set ftp:ssl-protect-data true;
                    set ftp:ssl-protect-list true;
                    set ssl:verify-certificate $VERIFY_CERT;
                    set ftp:passive-mode true;
                    set ftp:use-feat true;
                    set net:timeout 30;
                    set net:max-retries 3;
                    set net:reconnect-interval-base 5;
                    set mirror:parallel-transfer-count 4;
                    set xfer:clobber true;
                    open --env-password -u \"$FTPS_USER\" $SCHEME://$FTPS_HOST:$PORT;
                    mirror -R --no-perms --verbose build \"$REMOTE\";
                  " 2>&1 | tee /tmp/lftp.log
                  rc=${PIPESTATUS[0]}
                  set -e
                  if [ "$rc" -ne 0 ]; then
                    if grep -qE '530 ' /tmp/lftp.log; then
                      echo "::error::The host rejected the login (530). Check FTPS_USER and FTPS_PASSWORD; many shared hosts require the username in the form user@domain."
                    elif grep -qiE 'certificate|verify' /tmp/lftp.log; then
                      echo "::error::TLS certificate verification failed. Set the repository variable FTPS_VERIFY_CERT to false only if you trust this host."
                    fi
                    echo "::error::lftp exited with status $rc"
                    exit "$rc"
                  fi

name: Deploy site

# Builds the static apps and uploads each one over FTPS to
#   $FTPS_REMOTE_DIR + the app's SvelteKit base path
# e.g. FTPS_REMOTE_DIR=/public_html gives /public_html/tracker, /public_html/webneut,
# and the portfolio app (base '') lands directly in /public_html.
# Target directories are derived from each app's kit.paths.base, never configured per app.
#
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   FTPS_HOST, FTPS_USER, FTPS_PASSWORD
# Required repository variable (same screen, Variables tab):
#   FTPS_REMOTE_DIR   - document root of the site on the host
# Optional repository variables:
#   FTPS_PORT         - default 21 (use 990 for implicit FTPS)
#   FTPS_MODE         - "explicit" (default, AUTH TLS on port 21) or "implicit"
#   FTPS_VERIFY_CERT  - default true; set false for hosts with an incomplete chain
#   VITE_SATELLITE_API_URL - TLE API endpoint baked into the tracker bundle
#
# Uploads never delete: content-hashed assets change names, so the remote keeps
# stale files. Switch `mirror` to `mirror --delete` only on a directory that the
# app fully owns.

on:
    workflow_dispatch:
        inputs:
            apps:
                description: 'Apps to deploy, space separated (portfolio webneut tracker)'
                type: string
                default: tracker
    push:
        branches: [main]
        paths:
            - 'apps/**'
            - 'packages/**'
            - 'package.json'
            - 'bun.lock'
            - '.github/workflows/deploy-site.yml'

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    plan:
        name: Plan
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
        steps:
            - id: plan
              env:
                  EVENT: ${{ github.event_name }}
                  REQUESTED: ${{ inputs.apps }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT" = "push" ]; then
                    requested="tracker portfolio webneut"
                  else
                    requested="${REQUESTED:-tracker}"
                  fi
                  matrix=$(python3 -c 'import json,sys
                  all_apps=["tracker","portfolio","webneut"]
                  req=sys.argv[1].split()
                  bad=[a for a in req if a not in all_apps]
                  if bad: sys.exit("unknown app(s): "+" ".join(bad))
                  print(json.dumps({"app":[a for a in all_apps if a in req]}))' "$requested")
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
                  echo "Deploying: $matrix"

    build:
        name: Build ${{ matrix.app }}
        needs: plan
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # webneut's build compiles oscillator-rs to WASM; the runner has rustup but
            # needs the wasm target and wasm-pack.
            - name: Prepare Rust toolchain
              if: matrix.app == 'webneut'
              run: |
                  rustup target add wasm32-unknown-unknown
                  cargo install wasm-pack --locked

            - name: Build ${{ matrix.app }}
              env:
                  VITE_SATELLITE_API_URL:
                      ${{ vars.VITE_SATELLITE_API_URL ||
                      'https://thehuis.tail4fbfb1.ts.net/tles.json' }}
              run: bun run build
              working-directory: apps/${{ matrix.app }}

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-${{ matrix.app }}
                  path: apps/${{ matrix.app }}/build
                  if-no-files-found: error

    deploy:
        name: Deploy ${{ matrix.app }}
        needs: [plan, build]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
        steps:
            - name: Check configuration
              env:
                  FTPS_HOST: ${{ secrets.FTPS_HOST }}
                  FTPS_USER: ${{ secrets.FTPS_USER }}
                  FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
                  FTPS_REMOTE_DIR: ${{ vars.FTPS_REMOTE_DIR }}
              run: |
                  missing=""
                  [ -n "$FTPS_HOST" ] || missing="$missing secret:FTPS_HOST"
                  [ -n "$FTPS_USER" ] || missing="$missing secret:FTPS_USER"
                  [ -n "$FTPS_PASSWORD" ] || missing="$missing secret:FTPS_PASSWORD"
                  [ -n "$FTPS_REMOTE_DIR" ] || missing="$missing variable:FTPS_REMOTE_DIR"
                  if [ -n "$missing" ]; then
                    echo "::error::Not configured:$missing"
                    exit 1
                  fi

            # Only needed to read kit.paths.base out of the app's svelte.config.js.
            - uses: actions/checkout@v4

            - name: Resolve remote directory for ${{ matrix.app }}
              id: target
              env:
                  APP: ${{ matrix.app }}
                  FTPS_REMOTE_DIR: ${{ vars.FTPS_REMOTE_DIR }}
              run: |
                  set -euo pipefail
                  config="apps/$APP/svelte.config.js"
                  if [ ! -f "$config" ]; then
                    echo "::error::$config not found"
                    exit 1
                  fi
                  contents=$(< "$config")
                  if [[ "$contents" =~ base:[[:space:]]*\'([^\']*)\' ]]; then
                    base="${BASH_REMATCH[1]}"
                  else
                    echo "::error::No kit.paths.base in $config; cannot derive the remote directory"
                    exit 1
                  fi
                  if [ -n "$base" ] && [ "${base:0:1}" != "/" ]; then
                    base="/$base"
                  fi
                  root="${FTPS_REMOTE_DIR%/}"
                  remote="$root$base"
                  echo "remote=$remote" >> "$GITHUB_OUTPUT"
                  echo "$APP: base '$base' -> $remote"

            - name: Install lftp
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends lftp

            - uses: actions/download-artifact@v4
              with:
                  name: build-${{ matrix.app }}
                  path: build

            - name: Upload over FTPS
              env:
                  FTPS_HOST: ${{ secrets.FTPS_HOST }}
                  FTPS_USER: ${{ secrets.FTPS_USER }}
                  FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
                  FTPS_PORT: ${{ vars.FTPS_PORT || '21' }}
                  FTPS_MODE: ${{ vars.FTPS_MODE || 'explicit' }}
                  FTPS_VERIFY_CERT: ${{ vars.FTPS_VERIFY_CERT || 'true' }}
                  REMOTE: ${{ steps.target.outputs.remote }}
              run: |
                  set -euo pipefail
                  # 990 is implicit FTPS (TLS from the first byte); anything else is
                  # explicit FTPS (AUTH TLS on port 21).
                  PORT="${FTPS_PORT:-21}"
                  MODE="${FTPS_MODE:-explicit}"
                  VERIFY_CERT="${FTPS_VERIFY_CERT:-true}"
                  if [ "$MODE" = "implicit" ]; then
                    SCHEME="ftps"
                  else
                    SCHEME="ftp"
                  fi

                  echo "Uploading build/ to $REMOTE"
                  lftp -c "
                    set ftp:ssl-force true;
                    set ftp:ssl-protect-data true;
                    set ftp:ssl-protect-list true;
                    set ssl:verify-certificate $VERIFY_CERT;
                    set ftp:passive-mode true;
                    set ftp:use-feat true;
                    set net:timeout 30;
                    set net:max-retries 3;
                    set net:reconnect-interval-base 5;
                    set mirror:parallel-transfer-count 4;
                    set xfer:clobber true;
                    open -u \"$FTPS_USER\",\"$FTPS_PASSWORD\" $SCHEME://$FTPS_HOST:$PORT;
                    mirror -R --no-perms --verbose build \"$REMOTE\";
                  "

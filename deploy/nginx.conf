# Shared host config: one server block fronting every service on the box.
# Ports: 8081 tracker TLE API, 8083 transit snapshot API (8082 is taken by the Riven container).
# Copy to /etc/nginx/sites-available/ and symlink into sites-enabled.
limit_req_zone $binary_remote_addr zone=satellite_api:10m rate=10r/s;

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    # The TLE JSON is several MB; compress it on the way out. `gzip_proxied any`
    # is required because the payload comes from the upstream server. If nginx was
    # built with ngx_brotli, also enable `brotli on; brotli_types application/json;`
    # for a further ~30% over gzip.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json;

    limit_req zone=satellite_api burst=20 nodelay;
    limit_req_status 429;

    location = /health {
        # Static liveness for the vhost itself. It does not reflect upstream health:
        # per-service truth lives at /transit/health and (for the tracker) /health on :8081.
        return 200 '{"status":"ok"}';
        add_header Content-Type "application/json";
    }

    # Transit snapshot API (services/transit). The upstream is 8083 on this host
    # because 8082 is already published by the Riven container.
    location /transit/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_hide_header Server;
    }
}

[project]
name = "milovermeulen-backend"
version = "0.0.0"
# The backend uses `datetime.UTC` (3.11+) and is targeted/tested on 3.12.
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "SIM", "RUF"]
ignore = ["A002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
